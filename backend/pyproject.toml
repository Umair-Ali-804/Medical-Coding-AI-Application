[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medcoding-backend"
version = "1.0.0"
description = "AI-assisted medical coding platform: clinical documents -> evidence-backed ICD-10-CM/HCPCS/CPT suggestions with validation and human review."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "cryptography>=42",
  "httpx>=0.27",
  "tenacity>=8.3",
  "qdrant-client>=1.10",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "filetype>=1.2",
  "reportlab>=4.0",  # branded PDF reports in the workbench
]

[project.optional-dependencies]
# Local ONNX embeddings (default embedding provider in docker image)
embeddings = ["fastembed>=0.3"]
# Optional clinical NLP backends. The platform ships its own ConText/NegEx
# implementation, so these are enhancements, not requirements.
nlp = ["medspacy>=1.1", "scispacy>=0.5"]
# ICD-10-CM tabular data bundle (CDC public-domain XML) for KB bootstrap
kb = ["simple-icd-10-cm>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "simple-icd-10-cm>=1.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.extraction" = ["lexicon/*.tsv"]
"app.demo" = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::cryptography.utils.CryptographyDeprecationWarning"]
markers = ["postgres: requires TEST_POSTGRES_URL (real PostgreSQL)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "S311", "E501", "UP042", "B904", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"alembic/*" = ["E", "UP"]
