name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medcoding
          POSTGRES_PASSWORD: medcoding
          POSTGRES_DB: medcoding_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medcoding" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,kb]"
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Tests (SQLite suite + Postgres migrations, audit trigger, SKIP LOCKED)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://medcoding:medcoding@localhost:5432/medcoding_test
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Evaluation regression gate (dev split, retrieval-only baseline)
        env:
          DATABASE_URL: postgresql+psycopg://medcoding:medcoding@localhost:5432/medcoding_test
          VECTOR_STORE: memory
          EMBEDDING_PROVIDER: hash
          LLM_PROVIDER: heuristic
        run: |
          alembic upgrade head
          python -m app.cli kb load-icd10cm
          python -m app.evaluation.runner --split dev --baselines retrieval_only --out eval-dev.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-dev
          path: backend/eval-dev.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: medcoding-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: medcoding-frontend:ci
      - name: Validate compose
        run: |
          cp .env.example .env
          sed -i 's/^N8N_ENCRYPTION_KEY=$/N8N_ENCRYPTION_KEY=ci/' .env
          docker compose config -q
