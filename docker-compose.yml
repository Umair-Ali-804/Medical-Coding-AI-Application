# Medical Coding AI - full stack
#   docker compose up -d --build
# Services: postgres, qdrant, migrate (one-shot), api, worker, frontend, n8n (+ n8n-import one-shot)
name: medcoding

x-backend: &backend
  image: medcoding-backend:${APP_VERSION:-latest}
  build:
    context: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medcoding}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medcoding}
    QDRANT_URL: http://qdrant:6333
    VECTOR_STORE: qdrant
    STORAGE_DIR: /data/storage
    WEBHOOK_URL: ${WEBHOOK_URL:-http://n8n:5678/webhook/medcoding-events}
  volumes:
    - storage:/data/storage
  restart: unless-stopped
  networks: [backend]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcoding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medcoding}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-n8n.sh:/docker-entrypoint-initdb.d/10-init-n8n.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.17.0}
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      # Qdrant is only reachable on the internal network. To require an API key, add
      # QDRANT__SERVICE__API_KEY here and set the same QDRANT_API_KEY in .env.
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    volumes:
      - storage:/data/storage
      - ./data_sources:/reference:ro   # CMS/CDC reference files (see docs/DATA_SOURCES.md)
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 3g }

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      disable: true   # no HTTP server in the worker
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits: { memory: 2g }

  frontend:
    image: medcoding-frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      COOKIE_INSECURE: ${COOKIE_INSECURE:-0}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [backend]

  n8n-import:
    image: n8nio/n8n:${N8N_VERSION:-2.40.5}
    environment: &n8n-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # workflows read MEDCODING_* settings via $env
      MEDCODING_API_URL: http://api:8000
      MEDCODING_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      REVIEW_ALERT_WEBHOOK_URL: ${REVIEW_ALERT_WEBHOOK_URL:-}
      DOWNSTREAM_EXPORT_URL: ${DOWNSTREAM_EXPORT_URL:-}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    entrypoint: ["/bin/sh", "-c", "n8n import:workflow --separate --input=/workflows || true"]
    volumes:
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [backend]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.40.5}
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n:/home/node/.n8n
    depends_on:
      n8n-import: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [backend]

volumes:
  pgdata:
  qdrant:
  storage:
  n8n:

networks:
  backend:
